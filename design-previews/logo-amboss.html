<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>AppForge Amboss</title>
<style>
  html, body { margin: 0; background: #000; color: #F2F2F0; font: 14px/1.5 -apple-system, system-ui, sans-serif; }
  .board { padding: 36px; }
  h1 { font-weight: 500; font-size: 20px; margin: 0 0 6px; }
  p.lead { color: #8C8C8C; margin: 0 0 28px; max-width: 820px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .card { background: #0B0B0B; border: 1px solid #1E1E1E; border-radius: 18px; padding: 20px; }
  .card h2 { font-size: 15px; font-weight: 500; margin: 0 0 4px; }
  .card p { color: #8C8C8C; font-size: 12.5px; margin: 0 0 14px; min-height: 38px; }
  .big { width: 300px; height: 300px; display: block; margin: 0 auto 16px; }
  .row { display: flex; gap: 16px; align-items: end; justify-content: center; }
  .row div { text-align: center; color: #555; font-size: 10.5px; }
  .row svg { display: block; margin: 0 auto 4px; }
  .mono { filter: grayscale(1) contrast(1.3); }
  .light { background: #ECECEC; border-radius: 10px; padding: 8px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <clipPath id="form"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <radialGradient id="grund" cx=".5" cy=".45" r=".65">
      <stop offset="0" stop-color="#0C120E"/><stop offset="1" stop-color="#040504"/>
    </radialGradient>
    <linearGradient id="gruen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FF0B1"/><stop offset=".5" stop-color="#4CD97B"/><stop offset="1" stop-color="#2FA85A"/>
    </linearGradient>
    <filter id="leuchten" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="leuchtenSanft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feComponentTransfer in="b" result="b2"><feFuncA type="linear" slope=".8"/></feComponentTransfer>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Amboss nach der Vorlage: Horn mit Trennlinie, Arbeitsfläche, geschwungene Taille, Fuß mit Bogen und zwei Füßen.
         Koordinaten der Vorlage (800×530) werden per transform in das Icon gesetzt. -->
    <path id="umriss" d="M60 192 L295 192 L295 160 L697 160 L697 190 L686 214
      C600 220 520 250 492 305 C470 360 500 405 560 428 L585 432 L585 482 L495 482
      C480 426 335 426 320 482 L230 482 L230 432 L250 428
      C310 405 345 360 330 322 C322 300 300 296 280 294 L215 292 C150 290 95 250 60 205 Z"/>
    <path id="details" d="M295 192 L295 292 M230 452 L320 452 M495 452 L585 452"/>
  </defs>
</svg>

<div class="board" id="board">
  <h1>AppForge – Amboss mit SWIFT</h1>
  <p class="lead">Amboss nach deiner Vorlage, „SWIFT“ darunter, Grün #4CD97B aus AppForge. Stil wie Chroma und Cine.Cut: dunkler Grund, dünne weiße Linien, eine leuchtende Farbfläche.</p>
  <div class="grid" id="grid"></div>
</div>

<script>
  // Vorlage (Mitte x≈378, oben y=160) ins Icon setzen: Breite ≈ 520 px, Oberkante bei y≈330
  const place = `transform="translate(512 336) scale(.82) translate(-378 -160)"`;
  const text = (fill, extra = "") => `<text x="512" y="700" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif"
      font-weight="600" font-size="62" letter-spacing="30" fill="${fill}" ${extra}>SWIFT</text>`;
  const shapes = {
    // 1 · Grüne Linie: der Amboss als leuchtende grüne Linie, SWIFT in Weiß
    L: `<g clip-path="url(#form)"><rect x="100" y="100" width="824" height="824" fill="url(#grund)"/>
          <g ${place} fill="none" stroke="url(#gruen)" stroke-width="20" stroke-linejoin="round" stroke-linecap="round" filter="url(#leuchtenSanft)">
            <use href="#umriss"/><use href="#details"/>
          </g>
          ${text("#F2F2F0")}
        </g>`,
    // 2 · Weiß und Grün: weiße Linie wie bei deinen Icons, die Arbeitsfläche glüht grün
    W: `<g clip-path="url(#form)"><rect x="100" y="100" width="824" height="824" fill="#050505"/>
          <g ${place}>
            <clipPath id="koerper"><use href="#umriss"/></clipPath>
            <rect x="295" y="160" width="402" height="54" fill="url(#gruen)" clip-path="url(#koerper)" filter="url(#leuchten)"/>
            <g fill="none" stroke="#F2F2F0" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">
              <use href="#umriss"/><use href="#details"/>
            </g>
          </g>
          ${text("#4CD97B")}
        </g>`,
    // 3 · Grüne Fläche: der ganze Amboss als grün glühende Form, SWIFT in Weiß
    F: `<g clip-path="url(#form)"><rect x="100" y="100" width="824" height="824" fill="url(#grund)"/>
          <g ${place}>
            <use href="#umriss" fill="url(#gruen)" filter="url(#leuchten)"/>
            <use href="#details" fill="none" stroke="#0A2A15" stroke-width="12" stroke-linecap="round" opacity=".55"/>
          </g>
          ${text("#F2F2F0")}
        </g>`,
  };
  const concepts = [
    ["L", "1 · Grüne Linie", "Der Amboss als leuchtende grüne Linie wie in deiner Vorlage, SWIFT in Weiß darunter. Am nächsten an der Vorlage."],
    ["W", "2 · Weiß und Grün", "Weiße Linie wie bei Chroma und Cine.Cut, nur die Arbeitsfläche glüht grün, SWIFT in Grün. Am nächsten an deinen anderen Icons."],
    ["F", "3 · Grüne Fläche", "Der ganze Amboss als grün glühende Form, SWIFT in Weiß. Am kräftigsten, auch klein sofort erkennbar."],
  ];
  const svg = (id, size, cls = "") => `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 1024 1024">${shapes[id]}</svg>`;
  if (location.hash) {
    // #F: Mac-Icon (abgerundet, transparente Ecken) · #F-ios: iPhone-Icon (randlos, ohne Transparenz)
    const [id, target] = location.hash.slice(1).split("-");
    let inner = shapes[id];
    if (target === "klein") {
      // Für 16 und 32 px: ohne Schrift, Amboss größer und mittig – dort wäre SWIFT nicht lesbar
      inner = inner.replace(place, 'transform="translate(512 512) scale(.98) translate(-378 -321)"').replace(/<text[\s\S]*?<\/text>/, "");
      document.documentElement.style.background = document.body.style.background = "transparent";
    } else if (target === "ios") {
      inner = inner.replace('clip-path="url(#form)"', 'transform="translate(512 512) scale(1.2427) translate(-512 -512)"');
    } else {
      document.documentElement.style.background = document.body.style.background = "transparent";
    }
    document.getElementById("board").outerHTML = `<svg width="1024" height="1024" viewBox="0 0 1024 1024" style="display:block">${inner}</svg>`;
  } else {
    document.getElementById("grid").innerHTML = concepts.map(([id, title, info]) => `
      <section class="card"><h2>${title}</h2><p>${info}</p>
        ${svg(id, 300, "big")}
        <div class="row">
          <div>${svg(id, 64)}64</div><div>${svg(id, 32)}32</div><div>${svg(id, 16)}16</div>
          <div>${svg(id, 64, "mono")}einfarbig</div><div class="light">${svg(id, 48)}</div>
        </div>
      </section>`).join("");
  }
</script>
</body>
</html>
